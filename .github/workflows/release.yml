name: Build Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (tag for image)
        required: true
        default: preview

jobs:
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew assemble
      - name: Stage server payload
        run: |
          mkdir -p out/{conf,lib,schema,templates}
          cp target/tracker-server.jar out/
          cp target/lib/* out/lib/
          cp schema/* out/schema/
          cp -r templates/* out/templates/
          cp setup/traccar.xml out/conf/
      - uses: actions/upload-artifact@v4
        with:
          name: staged-server
          path: out
          retention-days: 1

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: traccar/traccar-web
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Stage web payload
        run: |
          mkdir -p out/web out/templates/translations
          cp -r build/* out/web/
          cp -r src/resources/l10n/* out/templates/translations/
      - uses: actions/upload-artifact@v4
        with:
          name: staged-web
          path: out
          retention-days: 1

  build-other:
    name: Build distribution zip
    needs: [build-server, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: staged-server
          path: setup/out
      - uses: actions/download-artifact@v4
        with:
          name: staged-web
          path: setup/out
      - name: Build zip
        working-directory: setup
        run: |
          mkdir -p out/data out/logs
          cp README.txt out/
          (cd out && zip -q -r "../traccar-other-${{ github.event.inputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: installers-other
          path: setup/traccar-other-*.zip
          retention-days: 1

  docker:
    name: Build & Push Docker
    needs: [build-other]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: installers-other
          path: docker

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest,enable=${{ github.event.inputs.version != 'preview' }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.alpine
          build-args: VERSION=${{ github.event.inputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
